name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Release APK
        working-directory: Lucrurile_Mele_Proiect_si_Cloud_APK-v2
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org com.lorean --project-name lucrurile_mele .
          cp /tmp/main_backup.dart lib/main.dart
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucrurile-Mele-APK
          path: Lucrurile_Mele_Proiect_si_Cloud_APK-v2/build/app/outputs/flutter-apk/app-release.apk
